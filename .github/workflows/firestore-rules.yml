name: Deploy Firestore Rules

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - firestore.rules
      - .github/workflows/firestore-rules.yml
      - scripts/test-firestore-rules.mjs

permissions:
  contents: read

jobs:
  deploy_rules:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci
      - name: Verify Firestore rules with the emulator
        run: npx --yes firebase-tools@15.34.0 emulators:exec --only firestore --project demo-statistics-rules 'node scripts/test-firestore-rules.mjs'
      - name: Deploy Firestore rules
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIBRARY_EXAM_NOTEBOOK }}
        run: |
          if [ -z "$FIREBASE_SERVICE_ACCOUNT" ]; then
            echo '::error::Firebase service account is not configured.'
            exit 1
          fi
          credential_file="$RUNNER_TEMP/firebase-service-account.json"
          printf '%s' "$FIREBASE_SERVICE_ACCOUNT" > "$credential_file"
          export GOOGLE_APPLICATION_CREDENTIALS="$credential_file"
          npx --yes firebase-tools@15.34.0 deploy --only firestore:rules --project library-exam-notebook --non-interactive
