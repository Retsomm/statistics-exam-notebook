name: Prepare common-subject source text

on:
  push:
    branches: [codex/common-paper-import]
    paths:
      - scripts/common-import/fetch-sources.py
      - .github/workflows/prepare-common-sources.yml
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fetch_sources:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Install PDF text tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y poppler-utils
          python -m pip install requests beautifulsoup4
      - name: Fetch official papers and extract text for review
        run: python scripts/common-import/fetch-sources.py
      - name: Save text-only review files on the import branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add data/import-review/common-sources
          if ! git diff --cached --quiet; then
            git commit -m 'Prepare official common-subject source text for review'
            git push origin HEAD:codex/common-paper-import
          fi
