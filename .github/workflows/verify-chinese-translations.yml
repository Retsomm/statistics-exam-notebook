name: Verify Chinese translations

on:
  push:
    branches: [main, codex/chinese-translations-review]
    paths:
      - data/chinese-classical.json
      - components/answer-explanation.tsx
      - tests/browser/chinese-translations.spec.ts
      - .github/workflows/verify-chinese-translations.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  reading:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npx playwright test tests/browser/chinese-translations.spec.ts
