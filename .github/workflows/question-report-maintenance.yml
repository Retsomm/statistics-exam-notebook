name: Question report maintenance
on:
  schedule:
    - cron: '17,47 * * * *'
  workflow_dispatch:
    inputs:
      verify_update_permission:
        description: 'Verify update-only IAM with an impossible version precondition (no data changes)'
        type: boolean
        default: false
  workflow_run:
    workflows: [Deploy Firebase Hosting]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: question-report-maintenance
  cancel-in-progress: false
jobs:
  collect:
    if: github.event_name != 'workflow_run' || github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: f4cd3b8a4257dadf263001de0be309d8a35ed3dc
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
      - name: Collect pending questions and apply deployed resolutions
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT_LIBRARY_EXAM_NOTEBOOK }}
          GITHUB_TOKEN: ${{ github.token }}
          VERIFY_FIRESTORE_UPDATE_PERMISSION: ${{ github.event_name == 'workflow_dispatch' && inputs.verify_update_permission && 'true' || 'false' }}
        run: node scripts/maintain-question-reports.mjs
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pending-question-reports
          path: report-maintenance-output/pending-question-reports.json
          retention-days: 14
          if-no-files-found: error
