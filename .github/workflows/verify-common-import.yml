name: Verify common-subject expansion

on:
  push:
    branches: [main, codex/common-paper-import, codex/civics-english-review, codex/question-layout-review, codex/data-processing-course-review, codex/statistics-course-review, codex/chinese-blanks-review, codex/memory-cards-review, codex/flip-card-review, codex/graph-explanation-review, codex/report-queue-review]
    paths:
      - components/*report*.tsx
      - lib/*report*
      - scripts/maintain-question-reports.mjs
      - tests/*report*.test.mjs
      - tests/browser/question-reports.spec.ts
      - scripts/data-processing/**
      - data/explanations/*-3d.json
      - components/explanation-diagram.tsx
      - lib/types.ts
      - tests/explanations.test.mjs
      - tests/browser/graph-explanation.spec.ts
      - lib/memory-cards.*
      - lib/study.mjs
      - lib/sync-model.mjs
      - lib/cloud-sync.ts
      - components/memory-deck.tsx
      - components/memory-card.tsx
      - components/memory-collection.tsx
      - components/study-app.tsx
      - components/favorites-tabs.tsx
      - tests/memory-cards.test.mjs
      - tests/browser/memory-cards.spec.ts
      - lib/chinese-blanks.mjs
      - tests/browser/chinese-blanks.spec.ts
      - data/statistics-course.json
      - components/note-plot.tsx
      - tests/statistics-course.test.mjs
      - tests/browser/statistics-course.spec.ts
      - data/data-processing-course.json
      - data/study-notes.json
      - components/study-notes.tsx
      - components/study-note-card.tsx
      - components/note-rich-sections.tsx
      - app/globals.css
      - tests/data-processing-course.test.mjs
      - tests/browser/data-processing-course.spec.ts
      - lib/question-layout.mjs
      - lib/question-text.mjs
      - tests/question-text.test.mjs
      - tests/browser/question-layout.spec.ts
      - data/common-bank-meta.json
      - data/explanations/*-1.json
      - data/english-passages.json
      - tests/new-civics-english.test.mjs
      - tests/browser/new-civics-english.spec.ts
      - tests/browser/common-import.spec.ts
      - .github/workflows/verify-common-import.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile practice
        run: npx playwright test tests/browser/question-reports.spec.ts tests/browser/graph-explanation.spec.ts tests/browser/memory-cards.spec.ts tests/browser/chinese-blanks.spec.ts tests/browser/statistics-course.spec.ts tests/browser/common-import.spec.ts tests/browser/new-civics-english.spec.ts tests/browser/question-layout.spec.ts tests/browser/study-notes.spec.ts tests/browser/data-processing-course.spec.ts
