name: Verify common-subject expansion

on:
  push:
    branches: [main, codex/common-paper-import, codex/civics-english-review, codex/question-layout-review]
    paths:
      - lib/question-layout.mjs
      - lib/question-text.mjs
      - tests/question-text.test.mjs
      - tests/browser/question-layout.spec.ts
      - data/common-bank-meta.json
      - data/explanations/*-1.json
      - data/english-passages.json
      - tests/new-civics-english.test.mjs
      - tests/browser/new-civics-english.spec.ts
      - tests/browser/common-import.spec.ts
      - .github/workflows/verify-common-import.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  practice:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - name: Verify desktop and mobile practice
        run: npx playwright test tests/browser/common-import.spec.ts tests/browser/new-civics-english.spec.ts tests/browser/question-layout.spec.ts
